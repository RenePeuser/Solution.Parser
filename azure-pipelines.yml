# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  - '*'

# Windows, because SampleApp.Wpf is a real WPF project: it is the fixture the XAML parser tests
# run against, and only a Windows agent compiles its markup. On Linux that check would be skipped.
pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  GitVersion.SemVer: ''

steps:

- task: UseDotNet@2
  displayName: 'Use .NET 10'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

- script: dotnet build --configuration $(buildConfiguration) /p:AssemblyVerison='$(GitVersion.SemVer)'
  displayName: 'dotnet build $(buildConfiguration)'

- script: dotnet list package --include-transitive --vulnerable
  displayName: 'Nuget vulnerability check'

- script: dotnet test
  displayName: 'dotnet test'

- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: 'pack'
    packagesToPack: '.'
    versioningScheme: 'off'

- task: PublishBuildArtifacts@1
  displayName: Publish artifacts
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'